# LLMRouterBench configuration for flagship models on coding-relevant benchmarks
# Models: GPT-5, Claude-4, Gemini-2.5-Pro, DeepSeek-V3.1, etc.
# Datasets: livecodebench, swe-bench, aime, livemathbench, gpqa, hle, mmlupro

baseline:
  results_dir: "results/bench"
  filters:
    skip_demo: true
    datasets: ['aime', 'livemathbench', 'gpqa', 'hle', 'livecodebench', 'mmlupro', 'swe-bench']
    models: ["claude-sonnet-4", "deepseek-v3-0324", "deepseek-v3.1-terminus", "deepseek-r1-0528", "gemini-2.5-flash", "gemini-2.5-pro", "gpt-5-chat", "gpt-5", "qwen3-235b-a22b-2507", "qwen3-235b-a22b-thinking-2507", "glm-4.6", "kimi-k2-0905", "intern-s1"]
    splits: ['test', 'hybrid', 'v1', 'test_3000', 'verified']
    exclude_datasets: null
    exclude_models: null
    exclude_splits: null
  columns:
    include:
      - dataset_id
      - split
      - model_name
      - record_index
      - prompt
      - score
      - cost