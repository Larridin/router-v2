# LLMRouterBench configuration for coding-relevant benchmarks only
# Code: humaneval, mbpp, livecodebench
# Math/Reasoning: aime, math500, mathbench, bbh, gpqa, mmlupro, kandk

baseline:
  results_dir: "results/bench"
  filters:
    skip_demo: true
    datasets: ['aime', 'bbh', 'gpqa', 'humaneval', 'kandk', 'livecodebench', 'math500', 'mathbench', 'mbpp', 'mmlupro']
    models: ["cogito-v1-preview-llama-8B", "DeepHermes-3-Llama-3-8B-Preview", "DeepSeek-R1-0528-Qwen3-8B", "DeepSeek-R1-Distill-Qwen-7B", "Fin-R1", "gemma-2-9b-it", "glm-4-9b-chat", "GLM-Z1-9B-0414", "granite-3.3-8b-instruct", "Intern-S1-mini", "internlm3-8b-instruct", "Llama-3.1-8B-Instruct", "Llama-3.1-8B-UltraMedical", "Llama-3.1-Nemotron-Nano-8B-v1", "MiMo-7B-RL-0530", "MiniCPM4.1-8B", "NVIDIA-Nemotron-Nano-9B-v2", "OpenThinker3-7B", "Qwen2.5-Coder-7B-Instruct", "Qwen3-8B"]
    splits: null
    exclude_datasets: null
    exclude_models: null
    exclude_splits: null
  columns:
    include:
      - dataset_id
      - split
      - model_name
      - record_index
      - prompt
      - score
      - cost