[package]
name = "routerlab-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Standalone inference core for Codex centroid router artifacts"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lib]
name = "routerlab_core"
path = "src/lib.rs"

[[bin]]
name = "routerlab-core"
path = "src/main.rs"
